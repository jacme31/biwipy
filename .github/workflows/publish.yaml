name: Publish Python Distribution

on:
  release:
    types: [published]

jobs:
  # ÉTAPE 1 : Construction et publication sur TestPyPI
  publish-to-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
      url: https://pypi.org

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://pypi.org

  # ÉTAPE 2 : Attente de validation et publication sur PyPI
  publish-to-pypi:
    name: Publish to PyPI Official
    needs: publish-to-testpypi # Cette étape attend le succès de TestPyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi # GitHub va bloquer ici et vous demander une validation manuelle
      url: https://pypi.org

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

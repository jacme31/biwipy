[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biwipy"
version = "0.1.0"
description = "Biwipy: cycling performance simulation with GRIB wind data"
authors = [
  { name="Jacques", email="your.email@example.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pygrib",
    "folium",
    "herbie-data",  # for GRIB finding
    "stravalib",
    "requests",
    "rasterio",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]
viz = [
    "plotly",
]
docs = [
    "sphinx>=7.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/biwipy"
"Bug Tracker" = "https://github.com/yourusername/biwipy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["refwindcycle*"]
